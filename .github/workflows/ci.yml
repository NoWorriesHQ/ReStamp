name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the test APK as a pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # The SDK repository's package name for API 37 isn't guaranteed to be plain
      # "android-37" (minor-version suffixes exist), so pick whatever it publishes.
      - name: Install Android 17 (API 37) SDK platform
        run: |
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u || true
          PKG=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-37[^ |]*" | sort -u | head -n 1)
          if [ -z "$PKG" ]; then echo "No API 37 platform package found"; exit 1; fi
          echo "Installing $PKG"
          yes | sdkmanager "$PKG" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine + JPEG via Robolectric)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: restamp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Run artifacts are zipped and hidden in the GitHub mobile app, so each PR also gets a
      # pre-release with the plain .apk, which a phone can download and install directly.
      - name: Publish test APK as a pre-release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="test-pr-$PR"
          APK="restamp-pr$PR-debug.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          NOTES="Debug test build of PR #$PR at commit ${SHA:0:7}. For testing only: back up your photos first."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --prerelease --target "$SHA" --title "Test build: PR #$PR" --notes "$NOTES"
          fi
          echo "APK: https://github.com/$GH_REPO/releases/download/$TAG/$APK" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
